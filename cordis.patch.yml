# dsh-ssh bundle patch: mounts dsh-ssh in route mode — `remoteRoot` is served
# over SSH, every other path stays local, nothing is withdrawn. See README.md.

- insert:
    - id: ssh
      name: dsh-ssh
      config:
        # resolved by the `ssh` CLI, so ~/.ssh/config Host aliases just work;
        # override in the profile's own cordis.patch.yml (applied after this layer)
        host: 192.168.0.68

        # sidebar marker: "my-project (remote)"
        remoteLabel: remote

        # absolute path on the REMOTE machine; opening a remote workspace also
        # creates an empty local mirror at the identical path, so pick one whose
        # ancestors are user-writable on BOTH machines — C:\Users\Public\... works,
        # C:\Users\<name>\... needs a one-time elevated seed on the local machine
        remoteRoot: 'C:\Users\Public\workplace'

        # this row is the route-mode entry; the remote-only takeover is the
        # separate `dsh-ssh/replace` entry at the bottom
        mode: route

        # defaultSide: auto   # 'remote' when the remote is not Windows
        # sshBin: ssh
        # remoteShell: powershell
        # mapRipgrep: true
        # connectTimeoutMs: 20000
        # requestTimeoutMs: 30000

        # these ssh calls have no terminal: BatchMode turns a missing key into a fast error, never a hidden prompt
        sshArgs: ['-o', 'BatchMode=yes', '-o', 'ConnectTimeout=10']

# --- remote-only shape (mode 'replace'): uncomment ALL FOUR rows together -----
# nothing on this machine stays reachable, and if the SSH providers fail the
# app has NO filesystem. the route row above must be disabled — its gate waits
# for the providers these rows withdraw.
